<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine Tiere – PetConnect</title>
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body data-page="dashboard">
    <main class="wrap">
        <div class="page-head section-head">
            <div>
                <h1 id="greeting">Meine Tiere</h1>
                <p class="lead">Hier verwaltest du deine Tiere und siehst Fundmeldungen, sobald jemand ein ähnliches Tier fotografiert.</p>
            </div>
            <a class="btn btn-primary" href="add-pet.html" id="addPetBtn"></a>
        </div>

        <div id="matchesSection" hidden></div>

        <div class="two-col" style="margin-top: 1.5rem;">
            <section aria-labelledby="petsTitle">
                <h2 id="petsTitle" class="sr-only">Deine Tiere</h2>
                <div id="petsList" class="pet-list"><div class="loading">Deine Tiere werden geladen …</div></div>
            </section>

            <aside class="panel">
                <h3 class="panel-title">Deine Kontaktdaten</h3>
                <p class="muted" style="margin-bottom: 1.25rem;">Die Telefonnummer steht auf deinen Vermisstenmeldungen, damit Finder dich direkt anrufen können.</p>
                <div class="note note-warn" id="phoneWarning" hidden style="margin-bottom: 1.25rem;"></div>
                <form id="profileForm" novalidate>
                    <div class="field-row">
                        <div class="field">
                            <label for="firstName">Vorname</label>
                            <input type="text" id="firstName" autocomplete="given-name">
                        </div>
                        <div class="field">
                            <label for="lastName">Nachname</label>
                            <input type="text" id="lastName" autocomplete="family-name">
                        </div>
                    </div>
                    <div class="field">
                        <label for="phone">Telefon</label>
                        <input type="tel" id="phone" autocomplete="tel" placeholder="z. B. 0151 23456789">
                    </div>
                    <div class="field">
                        <label for="location">Wohnort <span class="optional">(optional)</span></label>
                        <input type="text" id="location" autocomplete="address-level2" placeholder="z. B. München">
                    </div>
                    <button type="submit" class="btn btn-ghost btn-block">Kontaktdaten speichern</button>
                </form>
            </aside>
        </div>
    </main>

    <script src="../js/api.js"></script>
    <script>
        let user = null;
        let pets = [];

        document.getElementById('addPetBtn').innerHTML = `${icon('plus')}Tier hinzufügen`;

        async function init() {
            user = await requireAuth();
            if (!user) return;

            document.getElementById('greeting').textContent = `Hallo, ${user.first_name || user.username}`;
            document.getElementById('firstName').value = user.first_name || '';
            document.getElementById('lastName').value = user.last_name || '';
            document.getElementById('phone').value = user.phone || '';
            document.getElementById('location').value = user.location || '';

            await Promise.all([loadPets(), loadMatches()]);
        }

        async function loadPets() {
            const list = document.getElementById('petsList');
            try {
                const response = await api.get('pets/my-pets');
                pets = response.data.pets || [];
            } catch (e) {
                list.innerHTML = `<div class="empty"><h3>Deine Tiere konnten nicht geladen werden</h3><p>${esc(e.message)}</p><button class="btn btn-ghost" onclick="loadPets()">Erneut versuchen</button></div>`;
                return;
            }
            renderPets();
            updatePhoneWarning();
        }

        function renderPets() {
            const list = document.getElementById('petsList');
            if (pets.length === 0) {
                list.innerHTML = `
                    <div class="empty">
                        ${icon('paw')}
                        <h3>Noch kein Tier eingetragen</h3>
                        <p>Leg dein Tier jetzt mit einem aktuellen Foto an. Wird es vermisst, ist die Meldung dann mit zwei Klicks raus.</p>
                        <a class="btn btn-primary" href="add-pet.html">${icon('plus')}Erstes Tier eintragen</a>
                    </div>`;
                return;
            }

            list.innerHTML = pets.map(pet => {
                const missing = isMissing(pet);
                const meta = [speciesLabel(pet.species), pet.breed, pet.age ? `${pet.age} Jahre` : ''].filter(Boolean).join(' · ');
                return `
                    <article class="pet-row">
                        ${photoTag(petPhotoUrl(pet), pet.name)}
                        <div>
                            <h3>${esc(pet.name)} ${missing
                                ? '<span class="status status-missing">Vermisst</span>'
                                : '<span class="status status-home">Zuhause</span>'}</h3>
                            <p class="muted">${esc(meta)}</p>
                        </div>
                        <div class="actions">
                            ${missing
                                ? `<button class="btn btn-home btn-sm" data-action="found" data-id="${esc(pet.id)}">${icon('check')}Wieder zuhause</button>`
                                : `<a class="btn btn-danger btn-sm" href="report-missing.html?petId=${encodeURIComponent(pet.id)}">Als vermisst melden</a>`}
                            <button class="btn btn-ghost btn-sm" data-action="details" data-id="${esc(pet.id)}">Details</button>
                        </div>
                    </article>`;
            }).join('');
        }

        async function loadMatches() {
            const section = document.getElementById('matchesSection');
            let matches = [];
            try {
                matches = (await api.get('pets/matches')).matches || [];
            } catch (e) {
                return; // Fundmeldungen sind optional, Rest der Seite bleibt nutzbar
            }
            if (matches.length === 0) {
                section.hidden = true;
                return;
            }

            section.hidden = false;
            section.innerHTML = `
                <div class="match-alert">
                    <h2>${matches.length === 1 ? 'Eine mögliche Sichtung' : `${matches.length} mögliche Sichtungen`}</h2>
                    <p>Jemand hat ein Tier fotografiert, das deinem ähnlich sieht. Vergleiche das Foto und melde dich beim Finder.</p>
                    ${matches.map(m => {
                        const pct = Math.round(Number(m.similarity_score) * 100);
                        const contact = m.finder_contact || '';
                        const contactLink = /@/.test(contact) ? `<a href="mailto:${esc(contact)}">${esc(contact)}</a>` : esc(contact);
                        const mapLink = m.latitude && m.longitude
                            ? ` · <a href="https://www.openstreetmap.org/?mlat=${encodeURIComponent(m.latitude)}&mlon=${encodeURIComponent(m.longitude)}#map=17/${encodeURIComponent(m.latitude)}/${encodeURIComponent(m.longitude)}" target="_blank" rel="noopener">Karte öffnen</a>`
                            : '';
                        return `
                            <article class="match">
                                ${photoTag('/' + m.image, 'Foto vom Finder')}
                                <div>
                                    <h3>Ähnlich wie ${esc(m.pet_name)}</h3>
                                    <div class="similarity">
                                        <div class="similarity-bar"><i style="width:${pct}%"></i></div>
                                        <b>${pct} %</b><span class="muted">Ähnlichkeit</span>
                                    </div>
                                    <dl>
                                        <dt>Gefunden am</dt><dd>${esc(formatDate(m.created_at))}</dd>
                                        <dt>Fundort</dt><dd>${esc(formatPlace(m.location_found))}${mapLink}</dd>
                                        ${contact ? `<dt>Finder</dt><dd>${contactLink}</dd>` : ''}
                                        ${m.finder_phone ? `<dt>Telefon</dt><dd><a href="tel:${esc(m.finder_phone)}">${esc(m.finder_phone)}</a></dd>` : ''}
                                        ${m.description ? `<dt>Notiz</dt><dd>${esc(m.description)}</dd>` : ''}
                                    </dl>
                                </div>
                            </article>`;
                    }).join('')}
                </div>`;
        }

        function updatePhoneWarning() {
            const warn = document.getElementById('phoneWarning');
            const anyMissing = pets.some(isMissing);
            const hasPhone = !!document.getElementById('phone').value.trim();
            warn.hidden = !(anyMissing && !hasPhone);
            warn.innerHTML = `${icon('alert')}<div>Dein Tier wird vermisst, aber du hast keine Telefonnummer hinterlegt. Finder können dich so nur schwer erreichen.</div>`;
        }

        function showDetails(pet) {
            const facts = [
                ['Tierart', speciesLabel(pet.species)],
                ['Rasse', pet.breed],
                ['Farbe', pet.color],
                ['Alter', pet.age ? `${pet.age} Jahre` : ''],
                ['Gewicht', Number(pet.weight) ? `${Number(pet.weight).toLocaleString('de-DE')} kg` : ''],
                ['Mikrochip', pet.microchip_id],
                ['Eingetragen', formatDate(pet.created_at)]
            ].filter(([, v]) => v);

            openModal(`
                ${photoTag(petPhotoUrl(pet), pet.name, 'class="modal-photo"')}
                <div class="modal-body">
                    ${isMissing(pet) ? '<span class="status status-missing">Vermisst</span>' : '<span class="status status-home">Zuhause</span>'}
                    <h2 class="mt-1">${esc(pet.name)}</h2>
                    <dl class="facts">${facts.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
                    ${pet.distinguishing_features ? `<h4>Besondere Merkmale</h4><p class="muted">${esc(pet.distinguishing_features)}</p>` : ''}
                    <div class="form-actions" style="justify-content: space-between;">
                        <button class="btn-link" data-action="delete" data-id="${esc(pet.id)}">${esc(pet.name)} löschen</button>
                        ${isMissing(pet)
                            ? `<button class="btn btn-home" data-action="found" data-id="${esc(pet.id)}">${icon('check')}Wieder zuhause</button>`
                            : `<a class="btn btn-danger" href="report-missing.html?petId=${encodeURIComponent(pet.id)}">Als vermisst melden</a>`}
                    </div>
                </div>`);
        }

        async function markFound(pet, button) {
            if (!confirm(`Ist ${pet.name} wieder zuhause? Die Vermisstenmeldung wird dann aus der öffentlichen Liste entfernt.`)) return;
            setBusy(button, true, 'Wird gespeichert …');
            try {
                await api.put(`pets/${pet.id}/found`);
                closeModal();
                toast(`Schön, dass ${pet.name} wieder da ist! Die Meldung ist entfernt.`, 'success');
                await Promise.all([loadPets(), loadMatches()]);
            } catch (e) {
                toast(e.message, 'error');
                setBusy(button, false);
            }
        }

        async function deletePet(pet, button) {
            if (!confirm(`${pet.name} endgültig löschen? Profil, Fotos und Vermisstenmeldungen werden entfernt. Das lässt sich nicht rückgängig machen.`)) return;
            setBusy(button, true, 'Wird gelöscht …');
            try {
                await api.post('pets/delete', { pet_id: pet.id });
                closeModal();
                toast(`${pet.name} wurde gelöscht.`, 'success');
                await Promise.all([loadPets(), loadMatches()]);
            } catch (e) {
                toast(e.message, 'error');
                setBusy(button, false);
            }
        }

        document.addEventListener('click', (e) => {
            const button = e.target.closest('[data-action][data-id]');
            if (!button) return;
            const pet = pets.find(p => String(p.id) === button.dataset.id);
            if (!pet) return;
            if (button.dataset.action === 'details') showDetails(pet);
            if (button.dataset.action === 'found') markFound(pet, button);
            if (button.dataset.action === 'delete') deletePet(pet, button);
        });

        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const button = e.target.querySelector('button[type="submit"]');
            setBusy(button, true, 'Wird gespeichert …');
            try {
                await api.post('auth/profile', {
                    first_name: document.getElementById('firstName').value.trim(),
                    last_name: document.getElementById('lastName').value.trim(),
                    phone: document.getElementById('phone').value.trim(),
                    location: document.getElementById('location').value.trim()
                });
                toast('Kontaktdaten gespeichert.', 'success');
                updatePhoneWarning();
            } catch (err) {
                toast(err.message, 'error');
            } finally {
                setBusy(button, false);
            }
        });

        init();
    </script>
</body>
</html>
