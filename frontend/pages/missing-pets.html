<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vermisste Tiere – PetConnect</title>
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body data-page="missing">
    <main class="wrap">
        <div class="page-head section-head">
            <div>
                <h1>Vermisste Tiere</h1>
                <p class="lead">Diese Hunde und Katzen werden gerade gesucht. Hast du eines gesehen? Tippe auf die Meldung für Details und Kontakt.</p>
            </div>
        </div>

        <div class="filters" role="search">
            <div class="search">
                <span class="search-icon"></span>
                <label for="searchInput" class="sr-only">Suchen</label>
                <input type="search" id="searchInput" placeholder="Name, Rasse oder Ort">
            </div>
            <div class="chips" role="group" aria-label="Tierart">
                <button type="button" data-species="" aria-pressed="true">Alle</button>
                <button type="button" data-species="dog" aria-pressed="false">Hunde</button>
                <button type="button" data-species="cat" aria-pressed="false">Katzen</button>
            </div>
        </div>

        <div id="posters" class="posters"><div class="loading" style="grid-column: 1/-1">Meldungen werden geladen …</div></div>

        <div class="center mt-2">
            <button class="btn btn-ghost" id="loadMoreBtn" hidden>Weitere Meldungen laden</button>
            <p class="muted mt-1" id="countText" aria-live="polite"></p>
        </div>
    </main>

    <script src="../js/api.js"></script>
    <script>
        const PAGE_SIZE = 24;
        let allPets = [];
        let offset = 0;
        let species = '';

        document.querySelector('.search-icon').outerHTML = icon('search');

        async function loadPage() {
            const button = document.getElementById('loadMoreBtn');
            try {
                const response = await api.get('pets/missing', { limit: PAGE_SIZE, offset });
                const pets = response.pets || [];
                allPets.push(...pets);
                offset += pets.length;
                button.hidden = pets.length < PAGE_SIZE;
                render();
            } catch (e) {
                document.getElementById('posters').innerHTML =
                    `<div class="empty" style="grid-column: 1/-1"><h3>Meldungen konnten nicht geladen werden</h3><p>${esc(e.message)}</p><button class="btn btn-ghost" onclick="location.reload()">Erneut versuchen</button></div>`;
            }
        }

        function filtered() {
            const term = document.getElementById('searchInput').value.trim().toLowerCase();
            return allPets.filter(pet => {
                if (species && pet.species !== species) return false;
                if (!term) return true;
                return [pet.name, pet.breed, pet.color, pet.location_last_seen]
                    .some(v => v && String(v).toLowerCase().includes(term));
            });
        }

        function render() {
            const container = document.getElementById('posters');
            const pets = filtered();
            const count = document.getElementById('countText');

            if (allPets.length === 0) {
                container.innerHTML = `
                    <div class="empty" style="grid-column: 1/-1">
                        ${icon('paw')}
                        <h3>Gerade wird kein Tier vermisst</h3>
                        <p>Gute Nachrichten. Wenn du ein Tier gefunden hast, kannst du den Fund trotzdem melden – vielleicht sucht der Besitzer schon.</p>
                        <a class="btn btn-signal" href="found.html">${icon('camera')}Fund melden</a>
                    </div>`;
                count.textContent = '';
                return;
            }

            if (pets.length === 0) {
                container.innerHTML = `
                    <div class="empty" style="grid-column: 1/-1">
                        <h3>Keine passende Meldung</h3>
                        <p>Versuch einen anderen Suchbegriff oder zeig alle Tierarten an.</p>
                    </div>`;
            } else {
                container.innerHTML = pets.map(posterHTML).join('');
            }
            count.textContent = pets.length === allPets.length
                ? `${allPets.length} ${allPets.length === 1 ? 'Meldung' : 'Meldungen'}`
                : `${pets.length} von ${allPets.length} Meldungen`;
        }

        document.getElementById('searchInput').addEventListener('input', render);

        document.querySelectorAll('.chips button').forEach(button => {
            button.addEventListener('click', () => {
                species = button.dataset.species;
                document.querySelectorAll('.chips button').forEach(b => b.setAttribute('aria-pressed', b === button));
                render();
            });
        });

        document.getElementById('loadMoreBtn').addEventListener('click', loadPage);

        document.getElementById('posters').addEventListener('click', (e) => {
            const poster = e.target.closest('.poster');
            if (!poster) return;
            const pet = allPets.find(p => String(p.id) === poster.dataset.petId);
            if (pet) openModal(missingPetDetailHTML(pet));
        });

        loadPage();
    </script>
</body>
</html>
